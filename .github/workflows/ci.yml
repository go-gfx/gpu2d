name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: vet (js/wasm)
        shell: bash
        run: GOOS=js GOARCH=wasm go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: coverage gate (100%)
        shell: bash
        run: |
          go test -count=1 -coverprofile=cov.out .
          go tool cover -func=cov.out | tee cov.txt
          grep -q 'total:.*100.0%' cov.txt || { echo "coverage below 100%"; exit 1; }
      - name: parity with go-widgets/painter
        run: go -C internal/parity test -count=1 ./...

  # The Vulkan back-end on lavapipe (Mesa's software Vulkan) with the Khronos
  # validation layer, as in go-gfx/vulkan's CI. lavapipe and the layer are
  # oracles only. VULKAN_REQUIRE=1 turns a missing loader or device into a
  # failure, so the lane cannot go green by skipping; VULKAN_VALIDATION=1 makes
  # the tests capture stdout and stderr and fail on ANY validation message. The
  # test binary is built CGO_ENABLED=0 (cross-compile, then run), the way it
  # runs on a machine without a C toolchain. These are software numbers: they
  # prove the bindings, the generated kernel and byte identity under lavapipe's
  # arithmetic, not speed or a GPU's.
  vulkan:
    name: vulkan, lavapipe + validation layer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install lavapipe and the validation layer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libvulkan1
      - name: the devices the loader sees
        run: vulkaninfo --summary
      - name: parity and composition tests, validation layer on, CGO_ENABLED=0 test binary
        env:
          CGO_ENABLED: "0"
          VULKAN_REQUIRE: "1"
          VULKAN_VALIDATION: "1"
        run: |
          go test -c -o vulkan.test ./vulkan
          ./vulkan.test -test.v -test.count=1
      - name: tests without the layer, race detector
        env:
          VULKAN_REQUIRE: "1"
        run: go test -race -count=1 -v ./vulkan
      - name: benchmarks run (once each; shared runners' timings are not results)
        env:
          VULKAN_REQUIRE: "1"
        run: go test -count=1 -run '^$' -bench . -benchtime 1x ./vulkan

  # The Direct3D 11 kernel: kernel_gen.hlsl is checked on every platform; the DXBC
  # can only be made by D3DCompile, so this lane recompiles it and compares with
  # the committed kernel_gen.dxbc, with no tolerance. Its failure message names
  # the compiler DLL version of both sides and how to regenerate; the artifact
  # "dxbc" holds the fresh files (kernel_gen.dxbc and kernel_gen.dxbc.record). No
  # GPU is involved.
  d3d11:
    name: d3d11 (windows, WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./d3d11/... ./internal/hlslgen/...
      - name: DXBC drift test and the WARP back-end
        env:
          D3D11_DXBC_OUT: ${{ runner.temp }}\dxbc
          D3D11_REQUIRE: "1"
        run: go test -count=1 -v ./d3d11/... ./internal/hlslgen/...
      # Software numbers only: WARP on a CI VM, with the CPU reference beside it.
      # Never read them as GPU speed.
      - name: benchmark (WARP on a CI VM, and the CPU reference)
        env:
          D3D11_REQUIRE: "1"
        run: |
          go test -count=1 -run '^$' -bench 'WidgetFrame' -benchtime 20x -benchmem ./d3d11/
          go test -count=1 -run '^$' -bench 'Rasterize' -benchtime 20x ./
      - name: fresh DXBC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxbc
          path: ${{ runner.temp }}\dxbc
          if-no-files-found: warn

  linux-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test (32-bit int)
        env:
          GOARCH: "386"
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz FuzzList
        run: go test -run '^$' -fuzz FuzzList -fuzztime 60s .

  # The WebGPU back-end in a real Chromium worker, with go-gfx/webgpu's own
  # go test -exec runner built from its tagged source. macOS must get a GPU
  # adapter (WEBGPU_REQUIRE_GPU); Linux runs on SwiftShader, which proves the
  # pipeline and the shader, not a GPU. Flags and runner image as in
  # go-gfx/webgpu's CI.
  browser:
    name: browser (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: 'macOS, GPU required', os: macos-latest, require: '1', fallback: '0', args: '' }
          - { lane: 'Linux, fallback (SwiftShader)', os: ubuntu-24.04, require: '0', fallback: '1', args: '--enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: go-gfx/webgpu
          ref: v0.15.0
          path: webgpu-src
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Playwright driver and Chromium
        shell: bash
        run: |
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/pwdriver" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          go run github.com/go-wasmcontainers/playground/cmd/site@v0.2.0 playwright-driver --dir "$RUNNER_TEMP/pwdriver"
          PLAYWRIGHT_DRIVER_PATH="$RUNNER_TEMP/pwdriver" PLAYWRIGHT_NODEJS_PATH="$(command -v node)" \
            go -C webgpu-src/internal/cmd/wasmbrowser run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium
      - name: build the runner
        run: go -C webgpu-src/internal/cmd/wasmbrowser build -o "$RUNNER_TEMP/wasmbrowser" .
      - name: GOOS=js go test in a browser worker
        shell: bash
        env:
          WEBGPU_REQUIRE_GPU: ${{ matrix.require }}
          WEBGPU_ALLOW_FALLBACK: ${{ matrix.fallback }}
          WEBGPU_BROWSER_ARGS: ${{ matrix.args }}
        run: |
          status=0
          GOOS=js GOARCH=wasm go test -count=1 -v -exec="$RUNNER_TEMP/wasmbrowser" ./webgpu/ > "$RUNNER_TEMP/browser.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/browser.log"
          exit $status
      # Once each, so they keep working; shared runners' timings are not results.
      - name: benchmarks run (once each)
        shell: bash
        env:
          WEBGPU_BROWSER_ARGS: ${{ matrix.args }}
        run: |
          status=0
          GOOS=js GOARCH=wasm go test -count=1 -run '^$' -bench . -benchtime 1x -exec="$RUNNER_TEMP/wasmbrowser" ./webgpu/ > "$RUNNER_TEMP/bench.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/bench.log"
          exit $status

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          cd internal/parity && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
